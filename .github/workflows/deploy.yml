name: Deploy to VM

# One-time setup before this works:
#   1. In GitHub repo Settings -> Secrets and variables -> Actions, add:
#        DOCKERHUB_USERNAME   your Docker Hub username
#        DOCKERHUB_TOKEN      a Docker Hub access token (Docker Hub -> Account Settings -> Security -> New Access Token)
#        SSH_HOST             VM's public IP or hostname
#        SSH_USER             SSH username (e.g. root, ubuntu)
#        SSH_KEY              private key that can SSH into the VM
#        SITE_ADDRESS         e.g. 47-253-1-100.sslip.io (see README)
#   2. The Alibaba VM only needs Docker installed
#
# Fill in the blanks below (see curriculum Day 2 Session 2).

on:
  push:
    branches: [main] # <-- which branch triggers a deploy?

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }} # <-- which secret holds the Docker Hub token?
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/cloud-explorer:latest

  deploy:
    needs: build-and-push # <-- this job must wait for which job?
    runs-on: ubuntu-latest
    steps:
      - name: Check SSH_KEY secret looks like a private key
        env:
          SSH_KEY: ${{ secrets.SSH_KEY }}
        run: |
          if [ -z "$SSH_KEY" ]; then
            echo "::error::SSH_KEY secret is empty." >&2
            exit 1
          fi
          case "$SSH_KEY" in
            ssh-rsa*|ssh-ed25519*|ecdsa-sha2-*)
              echo "::error::SSH_KEY holds a PUBLIC key. Paste the PRIVATE key file (e.g. ~/.ssh/id_ed25519, no .pub)." >&2
              exit 1 ;;
            *"-----BEGIN"*"PRIVATE KEY-----"*) ;;
            *)
              echo "::error::SSH_KEY is not a PEM private key - it must start with '-----BEGIN ... PRIVATE KEY-----' and end with the matching '-----END' line." >&2
              exit 1 ;;
          esac
      - name: SSH and redeploy
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            set -e
            docker rm -f cloud-explorer || true
            docker run -d --pull always -p 80:80 -p 443:443 \
              -e SITE_ADDRESS=${{ secrets.SITE_ADDRESS  }} \
              --name cloud-explorer ${{ secrets.DOCKERHUB_USERNAME }}/cloud-explorer:latest
